spring:
  application:
    name: seat-reservation

  jackson:
    property-naming-strategy: SNAKE_CASE
  
  datasource:
    url: jdbc:postgresql://localhost:5432/seat_reservation
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa: 
    hibernate: 
      ddl-auto: validate 
    open-in-view: false
    properties: 
      hibernate: 
        format_sql: true 
  
  flyway: 
    enabled: true 

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: logstash

app:
  security:
    jwt:
      jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/realms/seat-reservation/protocol/openid-connect/certs}
      issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/seat-reservation}
      audience: ${JWT_AUDIENCE:seat-reservation-api}
    
  server: 
    port: 8080
