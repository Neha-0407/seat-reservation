spring:
  application:
    name: seat-reservation

  jackson:
    property-naming-strategy: SNAKE_CASE
  
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seat_reservation}}"
    username: "${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}"
    password: "${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}"
    driver-class-name: org.postgresql.Driver
  
  jpa: 
    hibernate: 
      ddl-auto: validate 
    open-in-view: false
    properties: 
      hibernate: 
        format_sql: true 
  
  flyway: 
    enabled: true 

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  endpoint:
    prometheus:
      access: read-only
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: logstash

app:
  security:
    jwt:
      jwk-set-uri: ${JWT_JWK_SET_URI:${KEYCLOAK_PUBLIC_URL:http://localhost:8081}/realms/seat-reservation/protocol/openid-connect/certs}
      issuer-uri: ${JWT_ISSUER_URI:${KEYCLOAK_PUBLIC_URL:http://localhost:8081}/realms/seat-reservation}
      audience: ${JWT_AUDIENCE:seat-reservation-api}

server:
  port: ${PORT:8080}
