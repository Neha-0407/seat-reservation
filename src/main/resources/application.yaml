spring:
  application:
    name: seat-reservation
  
  datasource:
    url: jdbc:postgresql://localhost:5432/seat_reservation
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa: 
    hibernate: 
      ddl-auto: validate 
    open-in-view: false
    properties: 
      hibernate: 
        format_sql: true 
  
  flyway: 
    enabled: true 
    
  server: 
    port: 8080
